[package]
name = "tauri-plugin-google-maps"
version = "0.1.0"
edition = "2021"
description = "App-internal Tauri plugin embedding a native Android Google Maps view. Desktop/iOS have no implementation -- see src/desktop.rs."
license = "LGPL-3.0-or-later"
# Required by the `tauri-plugin` build helper (see build.rs) -- must
# match `package.name` exactly, not a build-system quirk specific to
# this crate.
links = "tauri-plugin-google-maps"

# Matches the actual split in src/mobile.rs (Android) vs src/desktop.rs
# (everything else, all `Error::Unsupported`) -- not aspirational.
[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "none", notes = "Not implemented -- see the crate's own description." }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
