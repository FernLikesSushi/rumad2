[package]
name = "rumad-2"
version = "0.1.0"
description = "A scraping library and Tauri App for the RUMAD system, written in Rust and Tauri"
authors = ["you"]
edition = "2021"
license = "LGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rumad_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-native-map = { path = "plugins/tauri-plugin-native-map", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
vt100 = "0.16"
regex = "1"
russh = "0.63.1"
# Required unconditionally (not gated behind the `tauri` feature): `russh`
# is itself async-only, so `ssh`/`screens` -- the standalone scraping
# library, independent of Tauri (see `lib.rs`'s doc comment) -- need a
# runtime and `async fn` in the `RumadScreen` trait object regardless of
# whether the `tauri` feature/app is involved at all.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "macros", "sync"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# `objc2` is already pulled in transitively (by `wry`/`tao`) at the same
# 0.6.x this pins -- listed directly here only so `lib.rs`'s iOS-only
# `setup` hook can send it Objective-C messages (`UIScrollView.bounces`/
# `.alwaysBounceVertical`) against the raw `WKWebView*` Tauri hands back
# from `Webview::with_webview`, to get the native rubber-band overscroll
# iOS apps have by default -- WKWebView's own scroll view already
# bounces once there's overflow, but doesn't `alwaysBounceVertical`, so
# a screen whose content exactly fills the viewport (no overflow to
# bounce against) reads as inert/non-native, unlike a real iOS app.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[features]
default = ["tauri"]
# The `commands`/`run()` Tauri glue, on by default so the app itself (and
# `cargo build`/the VS Code launch config) need no changes. A consumer that
# only wants the scraping library (`screens`/`ssh`/`config`) depends on
# this crate with `default-features = false` instead, which pulls in none
# of tauri/tauri-plugin-opener/tauri-build.
tauri = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-os", "dep:tauri-plugin-native-map", "dep:tauri-build"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

