name: Build

# Push/PR to main: verification build only, installers uploaded as workflow
# artifacts, nothing published. Publishing a GitHub Release instead attaches
# those same installers directly to that (already-published, human-created)
# release -- no workflow artifacts in that case, the release is the
# deliverable. Native bundles (.msi/.exe/.deb/.AppImage/.dmg/.app) go through
# the official tauri-apps/tauri-action, which builds via the Tauri CLI and
# handles both upload paths itself (uploadWorkflowArtifacts / releaseId)
# without us hand-computing per-platform bundle output paths.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write # only used by tauri-action/the MSIX release-upload step, release-publish events only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-target: ""
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # No updater is configured (no `plugins.updater` in tauri.conf.json),
      # so the updater-JSON/signature upload this action defaults to is
      # switched off rather than uploading meaningless artifacts.
      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ github.event_name != 'release' }}
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          retryAttempts: 3

      # MSIX isn't a Tauri-native bundle target (it only produces .msi via
      # WiX and a setup .exe via NSIS -- see
      # https://tauri.app/distribute/windows-installer/), so tauri-action
      # above doesn't know about it either. It's hand-assembled here
      # instead: pack the plain rumad-2.exe Tauri already built as a
      # Desktop Bridge MSIX with the Windows SDK's makeappx.exe, then sign
      # it -- Windows refuses to install an MSIX at all otherwise, unlike
      # the .msi/.exe above which install fine unsigned with just a
      # SmartScreen warning. There's no purchased/trusted signing cert yet,
      # so this generates a throwaway self-signed one every run purely to
      # satisfy that requirement; the resulting package is only installable
      # by someone who explicitly trusts rumad-2-ci.cer first (also
      # uploaded below) -- swap in a real cert (import it and drop the
      # New-SelfSignedCertificate step) once one exists.
      #
      # `continue-on-error`: this is a bonus artifact, not the primary
      # deliverable (tauri-action's .msi/.exe/etc. already built and
      # uploaded above, in an earlier, separate step) -- a runner-image
      # quirk in here (e.g. an SDK version folder present but missing the
      # actual tool, live-observed on windows-latest) shouldn't fail the
      # whole job over it.
      - name: Package MSIX
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tauriConf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = "$($tauriConf.version).0"
          $publisher = "CN=rumad-2-ci"

          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName "rumad-2 CI (self-signed, testing only)" `
            -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable `
            -TextExtension @("2.5.29.19={text}false", "2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $pfxPasswordPlain = [System.Guid]::NewGuid().ToString()
          $pfxPassword = ConvertTo-SecureString -String $pfxPasswordPlain -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath rumad-2-ci.cer | Out-Null

          $payload = "msix-payload"
          New-Item -ItemType Directory -Path "$payload\Assets" -Force | Out-Null
          Copy-Item "src-tauri\target\release\rumad-2.exe" "$payload\rumad-2.exe"
          Copy-Item "src-tauri\icons\Square150x150Logo.png" "$payload\Assets\Square150x150Logo.png"
          Copy-Item "src-tauri\icons\Square44x44Logo.png" "$payload\Assets\Square44x44Logo.png"
          Copy-Item "src-tauri\icons\StoreLogo.png" "$payload\Assets\StoreLogo.png"

          (Get-Content .github/msix/AppxManifest.xml.template) `
            -replace '__VERSION__', $version `
            -replace '__PUBLISHER__', $publisher `
            | Set-Content "$payload\AppxManifest.xml"

          # Search for the actual executables rather than assuming every
          # version folder under bin\ has a populated x64\ subfolder --
          # live-observed on windows-latest: an old SDK version folder
          # (10.0.14393.0) exists there but doesn't contain makeappx.exe,
          # so picking "the newest-looking folder name" isn't reliable.
          # Sorting matched full paths descending still favors the newest
          # SDK version among the ones that actually have the tool, since
          # the version number sits at the same position in every path.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx -or -not $signtool) {
            throw "makeappx.exe/signtool.exe not found under Windows Kits -- skipping MSIX"
          }

          $bundleDir = "src-tauri\target\release\bundle\msix"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          $msixPath = "$bundleDir\rumad-2_$($tauriConf.version)_x64.msix"

          & $makeappx pack /d $payload /p $msixPath /overwrite
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          & $signtool sign /fd SHA256 /a /f cert.pfx /p $pfxPasswordPlain $msixPath
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Copy-Item rumad-2-ci.cer "$bundleDir\rumad-2-ci.cer"

      - name: Upload MSIX as workflow artifact
        if: ${{ matrix.platform == 'windows-latest' && github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: rumad-2-windows-msix
          path: |
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/bundle/msix/*.cer

      # tauri-action already resolved/uploaded to this same release above
      # (via `releaseId`); this just attaches the one bundle type it
      # doesn't know about.
      - name: Upload MSIX to release
        if: ${{ matrix.platform == 'windows-latest' && github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! compgen -G "src-tauri/target/release/bundle/msix/*.msix" > /dev/null; then
            echo "No MSIX bundle produced (Package MSIX step failed/skipped) -- skipping upload."
            exit 0
          fi
          gh release upload "${{ github.event.release.tag_name }}" \
            src-tauri/target/release/bundle/msix/*.msix \
            src-tauri/target/release/bundle/msix/*.cer \
            --clobber \
            --repo "${{ github.repository }}"

  # No Android keystore or Apple Developer signing cert exists as a repo
  # secret yet, so these are debug/unsigned verification builds only --
  # good enough to prove the app still builds for each platform, not
  # something installable on a real device or store-ready. Swap in real
  # credentials (an Android keystore + signingConfig, an Apple cert +
  # `TAURI_APPLE_DEVELOPMENT_TEAM`/`--export-method`) once those exist,
  # and drop `--debug`/`--no-sign` accordingly.
  #
  # This assumes `gen/android` and `gen/apple` are committed to the repo
  # (run `pnpm tauri android init` / `pnpm tauri ios init` locally once
  # and commit the result) -- unlike `gen/schemas`, they aren't generated
  # in CI, since regenerating them every run would silently discard any
  # manual customization made in them (AndroidManifest.xml permissions,
  # Info.plist entries, native code, etc.). Until that commit happens,
  # this job will fail at the build step with `gen/android`/`gen/apple`
  # missing.
  build-mobile:
    permissions:
      contents: write # only used by the release-upload steps, release-publish events only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-22.04
          - platform: ios
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Set up JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runner images already bundle an NDK (as
      # ANDROID_NDK_HOME) -- tauri's CLI specifically looks for NDK_HOME
      # though, which isn't set under that name, so just point it at the
      # one already on disk instead of installing a redundant copy.
      - name: Set NDK_HOME
        if: matrix.platform == 'android'
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        if: matrix.platform == 'ios'
        run: brew install cocoapods

      - name: Build Android APK (debug, unsigned)
        if: matrix.platform == 'android'
        run: pnpm tauri android build --debug --apk

      # Best-effort: unlike the Android leg, this hasn't been verified
      # against a real run (no macOS/Xcode available to test against
      # locally) -- `--no-sign` should skip needing an Apple Developer
      # certificate/team, but a device-target archive/export step may
      # still need one regardless. `continue-on-error` so a signing-
      # related failure here doesn't fail the whole workflow.
      - name: Build iOS app (unsigned)
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: pnpm tauri ios build --no-sign

      - name: Upload Android APK as workflow artifact
        if: ${{ matrix.platform == 'android' && github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: rumad-2-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload Android APK to release
        if: ${{ matrix.platform == 'android' && github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK produced -- skipping upload."
            exit 0
          fi
          gh release upload "${{ github.event.release.tag_name }}" "$apk" --clobber --repo "${{ github.repository }}"

      - name: Upload iOS app as workflow artifact
        if: ${{ matrix.platform == 'ios' && github.event_name != 'release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rumad-2-ios-app
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app

      - name: Upload iOS app to release
        if: ${{ matrix.platform == 'ios' && github.event_name == 'release' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          if [ -z "$artifact" ]; then
            echo "No iOS .ipa produced -- skipping upload."
            exit 0
          fi
          gh release upload "${{ github.event.release.tag_name }}" "$artifact" --clobber --repo "${{ github.repository }}"
