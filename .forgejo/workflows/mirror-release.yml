name: Mirror release to GitHub

# Runs on Codeberg only. Assumes git history/tags already reach the GitHub
# mirror some other way (push-mirror) -- this just recreates the release
# object + assets over there, since a push-mirror doesn't do that on its own.
#
# Needs repo variable GITHUB_MIRROR_REPO ("owner/name") and secret
# GH_MIRROR_TOKEN (a GitHub PAT with release write access on that repo).
on:
  release:
    types: [published]

jobs:
  mirror:
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub release
        shell: bash
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_MIRROR_REPO: ${{ vars.GITHUB_MIRROR_REPO }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          payload=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag, name: $name, body: $body, prerelease: $prerelease}')

          response=$(curl --fail -sS -X POST \
            "https://api.github.com/repos/$GITHUB_MIRROR_REPO/releases" \
            -H "Authorization: token $GH_MIRROR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload")

          upload_url=$(echo "$response" | jq -r '.upload_url' | sed 's/{.*}//')
          echo "upload_url=$upload_url" >> "$GITHUB_ENV"

      - name: Mirror release assets
        if: ${{ github.event.release.assets[0] != null }}
        shell: bash
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          echo "$ASSETS_JSON" | jq -c '.[]' | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            download_url=$(echo "$asset" | jq -r '.browser_download_url')

            curl --fail -sS -L -o "$name" "$download_url"

            curl --fail -sS -X POST \
              "$upload_url?name=$name" \
              -H "Authorization: token $GH_MIRROR_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$name"
          done
